apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentsapi
  namespace: fcg-phase2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paymentsapi
  template:
    metadata:
      labels:
        app: paymentsapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: paymentsapi
          image: viniciuscs84/fcg-payments-api:sha-ebd57fbafa8a05ddd18bef8d870fbcbea446c2fc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fcg-config
          env:
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paymentsapi
  namespace: fcg-phase2
spec:
  selector:
    app: paymentsapi
  ports:
    - name: http
      port: 8080
      targetPort: http
